openapi: 3.2.0
info:
  title: Datahub Report Flight Store API
  description: OpenAir Datahub acts as a central data repository for all functions, which affect the efficient functioning of an airport. Data can be ingested from various sources via standardized interfaces. The way of getting data out of it is similar; there are standardized REST and MQTT interfaces to fetch the data. The data structure is based on industry standards such as IATA's AIDM and ACI's ACRIS combined with decades of Vanderlande Logistics industry knowledge.
  contact:
    name: Vanderlande Logistics GmbH
    url: https://www.vanderlande.com
    email: info.digital@vanderlande-logistics.com
  license:
    name: Property of Vanderlande Logistics GmbH
  version: 6.6.0
tags:
- name: Report Flight Store
  externalDocs:
    description: The report flight store contains methods to access reporting data per flight
paths:
  /reportflight/{id}:
    get:
      tags:
      - Report Flight Store
      summary: Get report flight by id
      operationId: getReportFlightREST
      parameters:
      - name: id
        in: path
        description: The flight id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Ok: Default response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightLeg'
        '404':
          description: 'Not Found: flight leg with given id not found.'
      security:
      - aviationdatahub:
        - ADH.FL.R
  /reportflight/:
    get:
      tags:
      - Report Flight Store
      summary: Query report flight based on given search criteria
      description: If no query parameter is set the search will be reduced to the last 24 hours. If no maxResult is set a maximum of 1000 records will be returned.
      operationId: queryReportFlight
      parameters:
      - name: carrier
        in: query
        description: IATA 2-digit code of the operating carrier.
        required: false
        schema:
          type: string
      - name: flight-number
        in: query
        description: The numeric flight number of operating airline.
        required: false
        schema:
          type: string
      - name: operational-suffix
        in: query
        description: Used to distinguish two flights having the same flight number and departing from their respective origin stations on the same date.
        required: false
        schema:
          type: string
      - name: origin-date
        in: query
        description: The day of operation, i.e. local day of schedule off-block time in UTC at first departure airport of flight.
        required: false
        schema:
          type: string
      - name: origin-iata-code
        in: query
        description: The IATA code of an airport as origin airport of a flight leg.
        required: false
        schema:
          type: string
      - name: destination-iata-code
        in: query
        description: The IATA code of an airport as destination airport of a flight leg.
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: The (included) start point of the interval in UTC for the scheduled departure/ arrival time depending on values for origin/ destination airport. e.g. 2020-01-31T12:30:00.000Z. If used the from and the to parameter has to be set.
        required: false
        schema:
          type: string
      - name: to
        in: query
        description: The (excluded) end point of the interval in UTC for the scheduled departure/ arrival time depending on values for origin/ destination airport. e.g. 2020-01-31T12:30:00.000Z. If used the from and the to parameter has to be set.
        required: false
        schema:
          type: string
      - name: max-results
        in: query
        description: The maximum number of results.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportFlight'
      security:
      - aviationdatahub:
        - ADH.FL.R
components:
  schemas:
    FlightLeg:
      type: object
      description: Object holding the state of a flight leg.
      properties:
        meta:
          $ref: '#/components/schemas/AggregatedMeta'
          description: Metadata, generated by ADH.
          readOnly: true
        id:
          type: string
          description: The ID of flight leg in ADH.
        identifier-string:
          type: string
          deprecated: true
          description: Flight leg identifier as string. Deprecated, use identifier-string from identifier instead.
        identifier:
          $ref: '#/components/schemas/FlightIdentifier'
          description: Identifying properties of flight leg.
        secondary-identifiers:
          type: array
          description: Additional identifiers for the flight leg used by BHS etc.
          items:
            $ref: '#/components/schemas/SecondaryIdentifier'
          uniqueItems: true
        codeshare-strings:
          type: array
          description: List of codeshare identifiers as list of string.
          items:
            type: string
        codeshares:
          type: array
          description: Codeshare flight numbers.
          items:
            $ref: '#/components/schemas/FlightIdentifier'
        flight-segments:
          type: array
          description: Flight segments.
          items:
            $ref: '#/components/schemas/FlightSegment'
        outbound-resources:
          $ref: '#/components/schemas/AirportResources'
          description: Ground resources for outbound flight at departure airport.
        inbound-resources:
          $ref: '#/components/schemas/AirportResources'
          description: Ground resources for inbound flight at arrival airport.
        milestones:
          $ref: '#/components/schemas/Milestones'
          description: Milestone times at departure and arrival, i.e. off-block, take-off, landing, in-block.
        aircraft:
          $ref: '#/components/schemas/Aircraft'
          description: Aircraft used for operating the flight leg.
        is-international:
          type: boolean
          description: Indicates whether it is a domestic or an international flight leg.
        state:
          type: string
          description: Operational state of flight leg.
          enum:
          - SCHEDULED
          - CANCELLED
          - OFF_BLOCK
          - DEPARTED
          - LANDED
          - IN_BLOCK
        flight-pax:
          $ref: '#/components/schemas/FlightPax'
          description: Passenger counts of the flight leg
        via-segments:
          type: array
          description: Via flight numbers.
          items:
            $ref: '#/components/schemas/FlightSegment'
      required:
      - id
      - identifier
      - is-international
      - state
    FblbBag:
      type: object
      properties:
        bag-tag:
          type: string
        class-of-travel:
          type: string
        uld-tag:
          type: string
        reclaim-unit:
          type: string
        is-first-bag:
          type: boolean
        is-last-bag:
          type: boolean
        reclaim-belt-time:
          type: string
          format: date-time
    AggregatedMeta:
      type: object
      description: Metadata of DH objects.
      properties:
        created-at:
          type: string
          format: date-time
          description: Timestamp when object was first created in DH.
          readOnly: true
        created-by:
          $ref: '#/components/schemas/User'
          description: ID of user of event which caused the object to be created.
          readOnly: true
        created-event-type:
          type: string
          description: Event-type of event which caused the object to be created.
          readOnly: true
        created-event-time:
          type: string
          format: date-time
          description: Event-time of event which caused the object to be created.
          readOnly: true
        modified-count:
          type: integer
          format: int64
          description: Number of modifications in DH.
          readOnly: true
        modified-at:
          type: string
          format: date-time
          description: Timestamp of last modification in DH.
          readOnly: true
        modified-by:
          $ref: '#/components/schemas/User'
          description: ID of user of event which caused the object to be modified.
          readOnly: true
        modified-event-type:
          type: string
          description: Event-type of event which caused the object to be modified.
          readOnly: true
        modified-event-time:
          type: string
          format: date-time
          description: Event-time of event which caused the object to be modified.
          readOnly: true
        tag-id:
          type: string
          deprecated: true
          description: Unique id of the bag tag in the data hub for an unlimited period of time.
        skip-datawarehouse:
          type: boolean
          description: Skip Datawarehouse processing.
          readOnly: true
        skip-report-flight:
          type: boolean
          description: Skip Report Flight processing.
          readOnly: true
      readOnly: true
    MilestoneTimes:
      type: object
      properties:
        scheduled:
          type: string
          format: date-time
          description: Scheduled time for milestone.
        estimated:
          type: string
          format: date-time
          description: Estimated time for milestone.
        actual:
          type: string
          format: date-time
          description: Actual time for milestone.
        relevant:
          type: string
          format: date-time
          description: Relevant time for milestone, returns actual if set, else estimated if set, else scheduled.
    SecondaryIdentifier:
      type: object
      description: Additional identifiers for flight legs or segments used by airport systems etc.
      properties:
        identifier:
          type: string
          description: Secondary identifier .
        created:
          type: string
          format: date-time
          description: Timestamp of creation of secondary identifier in UTC.
        source:
          type: string
          description: Source creating the secondary identifier.
      required:
      - created
      - identifier
      - source
    FlightSegment:
      type: object
      description: Model for flight segments.
      properties:
        identifier:
          $ref: '#/components/schemas/FlightIdentifier'
          description: Identifying properties of flight segment.
        secondary-identifiers:
          type: array
          description: Additionally identifiers for the flight segment used by airport systems etc.
          items:
            $ref: '#/components/schemas/SecondaryIdentifier'
          uniqueItems: true
        is-international:
          type: boolean
          description: Indicates whether is is a domestic or an international flight segment.
        milestones:
          $ref: '#/components/schemas/Milestones'
          description: Milestone times at departure and arrival, i.e. off-block, take-off, landing, in-block.
      required:
      - identifier
      - is-international
    Aircraft:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of event.
        aircraft-type:
          type: string
          description: Aircraft type.
          example: A320
        registration-number:
          type: string
          description: Registration number.
    User:
      type: object
      description: Metadata of DH objects.
      properties:
        user-id:
          type: string
          description: Unique user id.
          readOnly: true
        user-name:
          type: string
          description: Readable user name
          readOnly: true
      readOnly: true
    AirportResource:
      type: object
      description: Description of an airport resource, allocated to a flight leg.
      example: AirportResource Description
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of event setting this resource in UTC.
        location:
          type: string
          description: Resource location or name.
          example: Apron
      required:
      - location
      - timestamp
    FlightPax:
      type: object
      description: Model for passenger count information.
      properties:
        pax-count:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ClassCount'
          description: Pax count of different classes, e.g., total, first class, second class, third class. The key for each class is dynamic and any key is supported.
        transfer-pax-count:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ClassCount'
          description: Transfer pax count of different classes, e.g., total, first class, second class, third class. The key for each class is dynamic and any key is supported.
        bag-count:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ClassCount'
          description: Bag count of different classes, e.g., total. The key for each class is dynamic and any key is supported.
        transfer-bag-count:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ClassCount'
          description: Transfer bag count of different classes, e.g., total. The key for each class is dynamic and any key is supported.
    AirportResources:
      type: object
      properties:
        aircraft-parking-position:
          $ref: '#/components/schemas/AirportResource'
          description: Gate or hard stand where the aircraft is located.
        passenger-gates:
          type: array
          description: The public gates which the passengers will use to board or disembark.
          items:
            $ref: '#/components/schemas/AirportResource'
        remote-operational-gates:
          type: array
          description: Additional location used to transfer passengers to or from a remote parking position.
          items:
            $ref: '#/components/schemas/AirportResource'
        runway:
          $ref: '#/components/schemas/AirportResource'
          description: The runway used for landing or take-off.
        aircraft-terminal:
          $ref: '#/components/schemas/AirportResource'
          description: Terminal where the aircraft is located.
        public-terminals:
          type: array
          description: Terminals where the passengers will be processed.
          items:
            $ref: '#/components/schemas/AirportResource'
        baggage-claim-units:
          type: array
          description: The number(s) or name(s) of the assigned baggage claim units.
          items:
            $ref: '#/components/schemas/AirportResource'
        baggage-make-up-belts:
          type: array
          description: The baggage makeup belts assigned for outgoing bags.
          items:
            $ref: '#/components/schemas/AirportResource'
        baggage-transfer-laterals:
          type: array
          description: The baggage transfer laterals assigned for incoming bags.
          items:
            $ref: '#/components/schemas/AirportResource'
        check-in-desks:
          $ref: '#/components/schemas/AirportResource'
          description: Check-in / baggage drop desks.
        baggage-make-up-belts-open-time:
          $ref: '#/components/schemas/AirportResource'
          description: The Opening Time of the baggage makeup belts assigned.
        baggage-make-up-belts-close-time:
          $ref: '#/components/schemas/AirportResource'
          description: The Closing Time of baggage makeup belts assigned.
    ReportFlight:
      type: object
      description: Object holding the state of a report flight.
      properties:
        identifier-string:
          type: string
          description: Automatically generated unique flight ID using format CARRIERFLIGHTNUMBER-OPERATIONALSUFFIX-DATE-ORIGIN-DESTINATION.
        fblb:
          $ref: '#/components/schemas/Fblb'
          description: 'First-bag last-bag report. '
        flight-leg:
          $ref: '#/components/schemas/FlightLeg'
          description: The flight leg business object.
        originDate:
          type: string
          format: date
          writeOnly: true
        aibt:
          type: string
          format: date-time
        meta:
          $ref: '#/components/schemas/AggregatedMeta'
          description: Metadata, generated by ADH.
          readOnly: true
      required:
      - flight-leg
      - identifier-string
    Milestones:
      type: object
      properties:
        gto:
          $ref: '#/components/schemas/MilestoneTimes'
          description: Gate open time at origin airport of flight leg.
        gtc:
          $ref: '#/components/schemas/MilestoneTimes'
          description: Gate closed time at origin airport of flight leg.
        obt:
          $ref: '#/components/schemas/MilestoneTimes'
          description: Off-block time at origin airport of flight leg.
        tot:
          $ref: '#/components/schemas/MilestoneTimes'
          description: Take-off time at origin airport of flight leg.
        ldt:
          $ref: '#/components/schemas/MilestoneTimes'
          description: Landing time at destination airport of flight leg.
        ibt:
          $ref: '#/components/schemas/MilestoneTimes'
          description: In-block time at destination airport of flight leg.
    FlightIdentifier:
      type: object
      description: Object holding identifying information for a flight.
      properties:
        carrier:
          type: string
          description: 2-digit IATA code of operating carrier.
          example: ZZ
        flight-number:
          type: string
          description: The flight number of the operating carrier. Should contain not more than 4 chars and must not include whitespaces. If less than 4 chars leading zeros will be added to normalize it to 4 chars.
          example: 997
        operational-suffix:
          type: string
          description: Used to distinguish two flights having the same flight number and departing from their respective origin stations on the same date.
          example: B
        origin-date:
          type: string
          format: date
          description: UTC scheduled date of departure of the first leg of the flight. Must be between 2010-01-01 and 2210-01-01.
        identifier-string:
          type: string
          description: Automatically generated unique flight ID using format CARRIERFLIGHTNUMBER-DATE-ORIGIN-DESTINATION.
        iata-message-key:
          type: string
          description: Automatically generated key using format CARRIERFLIGHTNUMBERSOBT. SOBT in the origin timezone
        iata-message-key-utc:
          type: string
          description: Automatically generated key using format CARRIERFLIGHTNUMBERSOBT. SOBT coverted to UTC
        origin-iata-code:
          type: string
          description: 3-digit IATA code of origin airport.
          example: AAA
        destination-iata-code:
          type: string
          description: 3-digit IATA code of destination airport.
          example: ZZZ
      required:
      - carrier
      - destination-iata-code
      - flight-number
      - origin-date
      - origin-iata-code
    ClassCount:
      type: object
      properties:
        planned:
          type: integer
          format: int32
          description: Planned/booked count.
          example: 100
        estimated:
          type: integer
          format: int32
          description: Estimated count.
          example: 99
        actual:
          type: integer
          format: int32
          description: Actual count.
          example: 102
    Fblb:
      type: object
      properties:
        fb-dt:
          type: string
          format: date-time
          description: Timestamp when the first bag was processed
        lb-dt:
          type: string
          format: date-time
          description: Timestamp when the last bag was processed
        fb-aibt:
          type: integer
          format: int32
          description: Duration in seconds between first bag date time and actual in block time.
        lb-aibt:
          type: integer
          format: int32
          description: Duration in seconds between last bag date time and actual in block time.
        read-rate:
          type: number
          format: float
          description: Percentage of bags that arrived at reclaim belt from the all virtual bags
        tags-checked-in:
          type: array
          items:
            type: string
          uniqueItems: true
        total-bags-check-in:
          type: integer
          format: int32
          description: Number of bags that were checked in
        tags-at-reclaim-belt:
          type: array
          description: A list of all the bags tags that were processed for that flight
          items:
            type: string
          uniqueItems: true
        total-bags-reclaim-belt:
          type: integer
          format: int32
          description: Number of bags that arrived at reclaim belt for that flight
        tags-missing:
          type: array
          description: A list of all the bags tags that were checked in but did not arrived at reclaim belt
          items:
            type: string
          uniqueItems: true
        total-bags-missing:
          type: integer
          format: int32
          description: Number of bags that arrived at reclaim belt for that flight
        tags-unexpected:
          type: array
          description: A list of all the bags tags that arrived at reclaim belt but were not checked in
          items:
            type: string
          uniqueItems: true
        total-bags-unexpected:
          type: integer
          format: int32
          description: Number of bags that were checked in
        fb-tag:
          type: string
        lb-tag:
          type: string
        tags-details:
          type: array
          items:
            $ref: '#/components/schemas/FblbBag'
        read-rate-expected:
          type: number
          format: float
          description: Percentage of bags that arrived at reclaim belt from the checked-in bags
