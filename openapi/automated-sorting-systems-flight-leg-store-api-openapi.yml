  /flightlegs/events/aircraftallocation:
    post:
      tags:
      - Flight Leg Store
      summary: Post a flight aircraft allocation event
      description: Transfers a flight aircraft allocation event to ADH. This may change the state of the flight leg. New data is processed asynchronously and may need some time to be updated.
      operationId: postFlightAircraftAllocationEvent
      requestBody:
