        estimated:
          type: string
          format: date-time
          description: Estimated time for milestone.
        actual:
          type: string
          format: date-time
          description: Actual time for milestone.
        relevant:
          type: string
          format: date-time
          description: Relevant time for milestone, returns actual if set, else estimated if set, else scheduled.
