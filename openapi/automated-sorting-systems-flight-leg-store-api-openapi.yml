          - IBT
          - GTO
          - GTC
          - OBT
          - TOT
        time-kind:
          type: string
          description: Time kind this time belongs to.
          enum:
          - SCHEDULED
          - ESTIMATED
          - ACTUAL
        timestamp:
          type: string
          format: date-time
          description: Timestamp of this time in UTC. Must be in range of origin-date minus 1 day and plus 7 days.
      required:
      - milestone
      - time-kind
      - timestamp
    AircraftParkingPositionResourceEvent:
      allOf:
      - $ref: '#/components/schemas/FlightEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - AIRCRAFT_PARKING_POSITION_RESOURCE_EVENT
          departure-or-arrival:
            type: string
            description: Indicator for departure or arrival related information.
            enum:
            - DEPARTURE
            - ARRIVAL
