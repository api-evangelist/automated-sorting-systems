  /flightlegs/events/cancelled:
    post:
      tags:
      - Flight Leg Store
      summary: Post a flight cancelled event
      description: Transfers a flight cancelled event to ADH. This may change the state of the flight leg. New data is processed asynchronously and may need some time to be updated.
      operationId: postFlightCancelledEvent
      requestBody:
