    Aircraft:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Timestamp of event.
        aircraft-type:
          type: string
          description: Aircraft type.
          example: A320
        registration-number:
          type: string
          description: Registration number.
    AirportResource:
