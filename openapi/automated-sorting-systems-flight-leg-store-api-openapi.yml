            type: string
            description: Aircraft parking position.
            example: Bay 15
      description: Entity for Business Events for aircraft parking position assignment to a flight.
      required:
      - aircraft-parking-position
      - departure-or-arrival
      - event-time
      - event-type
      - identifier
      - source
    MilestoneTimes:
      type: object
