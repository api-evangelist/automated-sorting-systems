openapi: 3.2.0
info:
  title: Datahub Flight Leg Store API
  description: OpenAir Datahub acts as a central data repository for all functions, which affect the efficient functioning of an airport. Data can be ingested from various sources via standardized interfaces. The way of getting data out of it is similar; there are standardized REST and MQTT interfaces to fetch the data. The data structure is based on industry standards such as IATA's AIDM and ACI's ACRIS combined with decades of Vanderlande Logistics industry knowledge.
  contact:
    name: Vanderlande Logistics GmbH
    url: https://www.vanderlande.com
    email: info.digital@vanderlande-logistics.com
  license:
    name: Property of Vanderlande Logistics GmbH
  version: 6.6.0
tags:
- name: Flight Leg Store
  externalDocs:
    description: The flight leg store contains methods to access and insert or modify flight leg data.
paths:
  /flightlegs/events/time:
    post:
      tags:
      - Flight Leg Store
      summary: Post a flight time event
      description: Transfers a flight time event to ADH. This may change the state of the flight leg. New data is processed asynchronously and may need some time to be updated.
      operationId: postFlightTimeEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightTimeEvent'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                  additionalProperties:
                    type: object
                - type: object
                  additionalProperties:
                    type: string
      security:
      - aviationdatahub:
        - ADH.FL.W
  /flightlegs/events/scheduled:
    post:
      tags:
      - Flight Leg Store
      summary: Post a flight scheduled event
      description: Transfers a flight scheduled event to ADH. This may change the state of the flight leg. New data is processed asynchronously and may need some time to be updated.
      operationId: postFlightScheduledEvent
      requestBody:
