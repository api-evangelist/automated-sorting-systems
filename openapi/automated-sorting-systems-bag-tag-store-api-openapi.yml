        in: query
        description: The iata code of the operating carrier. 2-digit code is expected.
        required: false
        schema:
          type: string
      - name: flight-number
        in: query
        description: The (numeric) flight number of operating airline.
        required: false
        schema:
          type: string
      - name: operational-suffix
        in: query
        description: Operational suffix of flight segment. Used to distinguish two flights having the same flight number and departing from their respective origin stations on the same date.
        required: false
        schema:
          type: string
      - name: origin-date
        in: query
        description: The day of operation, i.e. local day of schedule off-block time in UTC at first departure airport of flight.
        required: false
        schema:
          type: string
      - name: origin-iata-code
        in: query
        description: The iata code of an airport as origin airport of a flight leg the bag is booked on.
        required: false
        schema:
          type: string
      - name: destination-iata-code
        in: query
        description: The iata code of an airport as destination airport of a flight leg the bag is booked on.
        required: false
        schema:
          type: string
      - name: created-from
        in: query
        description: 'Object creation time by ADH: the start point of the interval in UTC (included). e.g. 2020-01-31T12:30:00.000Z.'
        required: false
        schema:
          type: string
      - name: created-to
