openapi: 3.2.0
info:
  title: Datahub Bag Tag Store API
  description: OpenAir Datahub acts as a central data repository for all functions, which affect the efficient functioning of an airport. Data can be ingested from various sources via standardized interfaces. The way of getting data out of it is similar; there are standardized REST and MQTT interfaces to fetch the data. The data structure is based on industry standards such as IATA's AIDM and ACI's ACRIS combined with decades of Vanderlande Logistics industry knowledge.
  contact:
    name: Vanderlande Logistics GmbH
    url: https://www.vanderlande.com
    email: info.digital@vanderlande-logistics.com
  license:
    name: Property of Vanderlande Logistics GmbH
  version: 6.6.0
tags:
- name: Bag Tag Store
  externalDocs:
    description: The bag tag store contains methods to access and insert or modify bag tag data.
paths:
  /bagtags/events/tracking:
    post:
      tags:
      - Bag Tag Store
      summary: Post a bag tracking event
      description: Transfers a bag tracking event to ADH. This may change the state of the bag tag. New data is processed asynchronously and may need some time to be updated.
      operationId: postBagTrackingEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BagTrackingEvent'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModelAndView'
      security:
      - aviationdatahub:
        - ADH.BT.W
  /bagtags/events/screening:
    post:
      tags:
      - Bag Tag Store
      summary: Post a bag screening event
      description: Transfers a bag screening event to ADH. This may change the state of the bag tag.New data is processed asynchronously and may need some time to be updated.
