      - minimum-connecting-time
      - quick-chute
      - standard-operating-procedure
    BagCancelEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_CANCEL_EVENT
          bag-segments:
            type: array
            description: Bag segments.
            items:
              $ref: '#/components/schemas/BagSegment'
            maxItems: 15
            minItems: 1
      description: Entity for Bag Cancel Business Events.
      required:
      - bag-segments
      - event-time
      - event-type
      - source
      - tag
    BagRiskLocation:
      type: object
      properties:
        assigned:
          type: string
          description: Assigned Location
          example: CHUTE 03
        time:
          type: string
          format: date-time
          description: Assignation Timestamp
          example: '2024-08-20T12:26:47.565851810Z'
      required:
      - assigned
      - time
    BagReRouteEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_ROUTE_EVENT
          bag-segments:
            type: array
            description: New bag segments.
            items:
