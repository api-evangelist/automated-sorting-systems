    Passenger:
      type: object
      description: Passenger attributes for bag tag.
      properties:
        pnr:
          type: string
          description: Unique passenger number.
        name:
          type: string
          description: Passenger name.
          example: Smith
        first-name:
          type: string
          description: Passenger first name.
          example: John
        gender:
          type: string
          description: Passenger gender.
          example: male
        title:
          type: string
          description: Passenger title.
          example: Mr.
        phone:
          type: string
          description: Passenger contact phone number.
          example: 001 123 456 789
        email:
          type: string
          description: Passenger contact email adress.
          example: passenger@test.com
        id:
          type: string
          description: Unique id of the passenger in the data hub for an unlimited period of time.
          example: ABCD-1234
        secondary-identifiers:
          type: array
          description: Additionally identifiers for the passenger used by airports etc.
          items:
            $ref: '#/components/schemas/SecondaryIdentifier'
          uniqueItems: true
      required:
      - name
    BagTrackingEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_TRACKING_EVENT
          tracking-point-type:
            type: string
            description: Type of tracking point. Depending on the type use either outbound-segment(BHS_INDUCTION, ATR, MES, BVS, EBS_IN, EBS_OUT, MUP_DISCHARGE, RECONCILED, CART_LOAD, LOAD, DEPARTED_FROM_MUP, ARRIVED_AT_BAY, ULD_SECURE_STORE_IN, ULD_SECURE_STORE_OUT)or inbound-segment(ATR, DEPARTED_FROM_BAY, ARRIVED_AT_TRANSFER_LATERAL, ARRIVED_AT_RECLAIM_BELT, UNLOAD, ULD_UNLOAD, RECLAIM_BELT_INDUCTION, DELIVERED, PROBLEM_AREA_DISCHARGE, DEPARTED_FROM_PROBLEM_AREA), never fill both.
            enum:
            - BHS_INDUCTION
            - ATR
            - MES
            - BVS
            - EBS_IN
            - EBS_OUT
            - MUP_DISCHARGE
            - RECONCILED
            - CART_LOAD
            - LOAD
            - DEPARTED_FROM_MUP
            - ARRIVED_AT_BAY
            - ULD_SECURE_STORE_IN
            - ULD_SECURE_STORE_OUT
            - DEPARTED_FROM_BAY
            - ARRIVED_AT_TRANSFER_LATERAL
            - ARRIVED_AT_RECLAIM_BELT
            - UNLOAD
            - ULD_UNLOAD
            - RECLAIM_BELT_INDUCTION
            - DELIVERED
            - PROBLEM_AREA_DISCHARGE
            - DEPARTED_FROM_PROBLEM_AREA
          tracking-state:
            type: string
            description: State of tracking.
            enum:
            - SUCCESS
            - NO_READ
            - TRACKING_LOST
            - MULTIPLE_READ
            - NO_BSM
            - SEND_TO_PROBLEM
          transport-state:
            type: string
            description: State of transport within BHS.
      description: Entity for Bag Tracking Business Events. Be aware that either the inbound or the outbound segement needs to be set.
      required:
      - event-time
      - event-type
      - source
      - tag
      - tracking-point-type
    BagTagIdentifier:
      type: object
      description: Additional identifiers for bag tags used by airport systems etc.
      properties:
        identifier:
          type: string
          description: Internal identifier for the bag.
          example: ABCD-1234
        created:
          type: string
          format: date-time
          description: Timestamp of creation of internal identifier for the bag.
        source:
          type: string
          description: Source creating the internal identifier for the bag.
      required:
      - created
      - identifier
      - source
    BagRisk:
      type: object
      properties:
        calculation-time:
          type: string
          format: date-time
          description: Time of calculation of the risk level
          example: '2024-08-20T12:26:47.565851810Z'
        risk-level:
          type: string
          description: Risk Level Calculated
          enum:
          - UNKNOWN
          - MISSED
          - CRITICAL
          - AT_RISK
          - ON_TIME
          - EARLY
          example: ON_TIME
        previousRiskLevel:
          type: string
          description: Risk Level Calculated
          enum:
          - UNKNOWN
          - MISSED
          - CRITICAL
          - AT_RISK
          - ON_TIME
          - EARLY
          example: ON_TIME
        validity:
          type: string
          format: date-time
          description: Validity Date of the Risk Level
          example: '2024-08-20T12:26:47.565851810Z'
        mup:
          $ref: '#/components/schemas/BagRiskLocation'
          description: Assigned Mup
        inbound-bay:
          $ref: '#/components/schemas/BagRiskLocation'
          description: Assigned Inbound Bay
        outbound-bay:
          $ref: '#/components/schemas/BagRiskLocation'
          description: Assigned Outbound Bay
        tl:
          $ref: '#/components/schemas/BagRiskLocation'
          description: Assigned Transfer Lateral
        carousel:
          $ref: '#/components/schemas/BagRiskLocation'
          description: Assigned Carousel
        check-in:
          $ref: '#/components/schemas/BagRiskLocation'
          description: Assigned Check In Desk
      required:
      - calculation-time
      - carousel
      - check-in
      - inbound-bay
      - mup
      - outbound-bay
      - previousRiskLevel
      - risk-level
      - tl
      - validity
    FlightSegmentBagTag:
      type: object
