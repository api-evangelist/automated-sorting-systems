        required: false
        schema:
          type: string
      - name: container-tag
        in: query
        description: The container tag that was submitted in containerization events.
        required: false
        schema:
          type: string
      - name: max-results
        in: query
        description: The maximum number of results.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BagTag'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModelAndView'
      security:
      - aviationdatahub:
        - ADH.BT.R
components:
  schemas:
    BagSegment:
      type: object
      description: Object holding a the state of a bag represented by bag tag for a flight segment.
      properties:
        sequence-number:
          type: integer
          format: int32
          description: Sequence number of bag segment within bag journey.
        tag:
          type: string
          description: Tag number of the bag tag used on this segment.
          example: B12345678
        class-of-travel:
          type: string
          description: Class of travel.
          example: M
        is-rush-bag:
          type: boolean
          description: Flags if this is a rush bag.
        passenger-is-crew-member:
          type: boolean
          description: Flags if bag belongs to a crew member. Put false or 0 to set it to non-crew member. Everything greater than 0 will be interpreted as true.
        bag-activities:
          $ref: '#/components/schemas/BagActivities'
          description: Activities captured for this bag.
        oldest-inbound-activity-type:
          type: string
          description: Type of oldest inbound activity.
        oldest-inbound-activity:
          $ref: '#/components/schemas/BagActivity'
          description: Oldest inbound activity.
        newest-inbound-activity-type:
          type: string
          description: Type of newest inbound activity.
        newest-inbound-activity:
          $ref: '#/components/schemas/BagActivity'
          description: Newest inbound activity.
        oldest-outbound-activity-type:
          type: string
          description: Type of oldest outbound activity.
        oldest-outbound-activity:
          $ref: '#/components/schemas/BagActivity'
          description: Oldest outbound activity.
        newest-outbound-activity-type:
          type: string
          description: Type of newest outbound activity.
        newest-outbound-activity:
          $ref: '#/components/schemas/BagActivity'
          description: Newest outbound activity.
        identifier:
          $ref: '#/components/schemas/FlightIdentifier'
          description: Bag segment identifier.
        newest-activity-type:
          type: string
          description: Newest activity type either outbound, inbound or segment
        state:
          type: string
          description: 'State of the bag segment. '
          enum:
          - ACTIVE
          - COMPLETED
          - DELETED
          example: ACTIVE, COMPLETED or DELETED
        enriched:
          type: boolean
          description: Indication if this Bag Segment was Enriched.
      required:
      - identifier
    BagActivity:
      type: object
      description: Details on a specific bag activity on a bag segment.
      properties:
        location-type:
          type: string
          description: Type of location.
          enum:
          - SEGMENT
          - OUTBOUND
          - INBOUND
        timestamp:
          type: string
          format: date-time
          description: Timestamp in UTC.
        location:
          type: string
          description: Location.
    User:
      type: object
      description: Metadata of DH objects.
      properties:
        user-id:
          type: string
          description: Unique user id.
          readOnly: true
        user-name:
          type: string
          description: Readable user name
          readOnly: true
      readOnly: true
    BagJourney:
      type: object
      properties:
        bag-initialized:
          $ref: '#/components/schemas/BagPhase'
        inbound:
          $ref: '#/components/schemas/BagJourneyPhase'
        transfer:
          $ref: '#/components/schemas/BagJourneyPhase'
        in-system:
          $ref: '#/components/schemas/BagJourneyPhase'
        outbound:
          $ref: '#/components/schemas/BagJourneyPhase'
    ContainerizationActivity:
      type: object
      description: BagActivity for Containerization.
      properties:
        location-type:
          type: string
          description: Type of location.
          enum:
          - SEGMENT
          - OUTBOUND
          - INBOUND
        timestamp:
          type: string
          format: date-time
          description: Timestamp in UTC.
        location:
          type: string
          description: Location.
        container-tag:
          type: string
          description: Container tag.
          example: A12345678
        container-activity:
          type: string
          description: Container activity.
          enum:
          - LOAD
          - OFFLOAD
          - REMOVE
          - MERGE
        container-type:
          type: string
          description: Container type like ULD/dolly/aircraft. The activity is dependent to this type.
          example: ULD
    BagLoadIntoUldEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_LOAD_INTO_ULD_EVENT
          uld-tag:
            type: string
            description: ULD tag.
            example: A12345678
          sequence-number:
            type: integer
            format: int32
            description: Loading sequence number of bag in uld. Must be 1 or greater.
            example: 1
            minimum: 1
      description: Entity for bag load into uld Business Events.
      required:
      - event-time
      - event-type
      - source
      - tag
      - uld-tag
    HttpStatusCode:
      type: object
      properties:
        error:
          type: boolean
        is4xxClientError:
          type: boolean
        is5xxServerError:
          type: boolean
        is1xxInformational:
          type: boolean
        is2xxSuccessful:
          type: boolean
        is3xxRedirection:
          type: boolean
    SecondaryIdentifier:
      type: object
      description: Additional identifiers for flight legs or segments used by airport systems etc.
      properties:
        identifier:
          type: string
          description: Secondary identifier .
        created:
          type: string
          format: date-time
          description: Timestamp of creation of secondary identifier in UTC.
        source:
          type: string
          description: Source creating the secondary identifier.
      required:
      - created
      - identifier
      - source
    BagScreeningEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_SCREENING_EVENT
          screening-level:
            type: integer
            format: int32
            description: Screening level.
          cleared:
            type: boolean
            description: Cleared.
      description: Entity for Bag Screening Business Events.
      required:
      - cleared
      - event-time
      - event-type
      - screening-level
      - source
      - tag
    BagContainerizationEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_CONTAINERIZATION_EVENT
          function:
            type: string
            description: Type of event activity.
            enum:
            - LOAD
            - OFFLOAD
            - REMOVE
            - MERGE
          container-tag:
            type: string
            description: Identifier for journey of the Container.
            example: A234223423
          container-type:
            type: string
            description: Container type like ULD/dolly/aircraft.
            example: ULD
          sequence-number:
            type: integer
            format: int32
            description: Loading sequence number of bag into container.
            example: 2
          bag-segments:
            type: array
            description: Segments.
            items:
              $ref: '#/components/schemas/BagSegment'
            maxItems: 15
            minItems: 1
          container-direction:
            type: string
            description: Direction of the container event.
            enum:
            - INBOUND
            - OUTBOUND
            - TRANSFER
            example: inbound
      description: Entity for bag containerization Business Events.
      required:
      - bag-segments
      - event-time
      - event-type
      - function
      - source
      - tag
    ScreeningActivity:
      type: object
      description: BagActivity for screening.
      properties:
        location-type:
          type: string
          description: Type of location.
          enum:
          - SEGMENT
          - OUTBOUND
          - INBOUND
        timestamp:
          type: string
          format: date-time
          description: Timestamp in UTC.
        location:
          type: string
          description: Location.
        level:
          type: integer
          format: int32
          description: Screening level.
        cleared:
          type: boolean
          description: Cleared.
    FlightIdentifier:
      type: object
      description: Object holding identifying information for a flight.
      properties:
        carrier:
          type: string
          description: 2-digit IATA code of operating carrier.
          example: ZZ
        flight-number:
          type: string
          description: The flight number of the operating carrier. Should contain not more than 4 chars and must not include whitespaces. If less than 4 chars leading zeros will be added to normalize it to 4 chars.
          example: 997
        operational-suffix:
          type: string
          description: Used to distinguish two flights having the same flight number and departing from their respective origin stations on the same date.
          example: B
        origin-date:
          type: string
          format: date
          description: UTC scheduled date of departure of the first leg of the flight. Must be between 2010-01-01 and 2210-01-01.
        identifier-string:
          type: string
          description: Automatically generated unique flight ID using format CARRIERFLIGHTNUMBER-DATE-ORIGIN-DESTINATION.
        iata-message-key:
          type: string
          description: Automatically generated key using format CARRIERFLIGHTNUMBERSOBT. SOBT in the origin timezone
        iata-message-key-utc:
          type: string
          description: Automatically generated key using format CARRIERFLIGHTNUMBERSOBT. SOBT coverted to UTC
        origin-iata-code:
          type: string
          description: 3-digit IATA code of origin airport.
          example: AAA
        destination-iata-code:
          type: string
          description: 3-digit IATA code of destination airport.
          example: ZZZ
      required:
      - carrier
      - destination-iata-code
      - flight-number
      - origin-date
      - origin-iata-code
    BagReFlightEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_REFLIGHT_EVENT
          bag-segments:
            type: array
            description: New or updated bag segments.
            items:
              $ref: '#/components/schemas/BagSegment'
            maxItems: 15
            minItems: 1
          retired-tag:
            type: string
            description: Retired tag number for the bag, if tag number has been updated.
            example: R12345678
      description: Entity for Bag Re-Flight Business Events.
      required:
      - bag-segments
      - event-time
      - event-type
      - source
      - tag
    View:
      type: object
      properties:
        contentType:
          type: string
    AggregatedMeta:
      type: object
      description: Metadata of DH objects.
      properties:
        created-at:
          type: string
          format: date-time
          description: Timestamp when object was first created in DH.
          readOnly: true
        created-by:
          $ref: '#/components/schemas/User'
          description: ID of user of event which caused the object to be created.
          readOnly: true
        created-event-type:
          type: string
          description: Event-type of event which caused the object to be created.
          readOnly: true
        created-event-time:
          type: string
          format: date-time
          description: Event-time of event which caused the object to be created.
          readOnly: true
        modified-count:
          type: integer
          format: int64
          description: Number of modifications in DH.
          readOnly: true
        modified-at:
          type: string
          format: date-time
          description: Timestamp of last modification in DH.
          readOnly: true
        modified-by:
          $ref: '#/components/schemas/User'
          description: ID of user of event which caused the object to be modified.
          readOnly: true
        modified-event-type:
          type: string
          description: Event-type of event which caused the object to be modified.
          readOnly: true
        modified-event-time:
          type: string
          format: date-time
          description: Event-time of event which caused the object to be modified.
          readOnly: true
        tag-id:
          type: string
          deprecated: true
          description: Unique id of the bag tag in the data hub for an unlimited period of time.
        skip-datawarehouse:
          type: boolean
          description: Skip Datawarehouse processing.
          readOnly: true
        skip-report-flight:
          type: boolean
          description: Skip Report Flight processing.
          readOnly: true
      readOnly: true
    BagChangeEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_CHANGE_EVENT
          bag-segments:
            type: array
            description: Changed bag segments.
            items:
              $ref: '#/components/schemas/BagSegment'
            maxItems: 15
            minItems: 1
          authorized-to-load:
            type: boolean
            description: Authorized to load that comes with BSM reconciliation data element.
            example: true
      description: Entity for Bag Change Business Events.
      required:
      - bag-segments
      - event-time
      - event-type
      - source
      - tag
    ModelAndView:
      type: object
      properties:
        view:
          $ref: '#/components/schemas/View'
        model:
          type: object
          additionalProperties:
            type: object
        status:
          $ref: '#/components/schemas/HttpStatusCode'
        empty:
          type: boolean
        viewName:
          type: string
        reference:
          type: boolean
        modelMap:
          type: object
          additionalProperties:
            type: object
          properties:
            empty:
              type: boolean
    BagJourneyPhase:
      type: object
      properties:
        uld-driving:
          $ref: '#/components/schemas/BagPhase'
        uld-tralat:
          $ref: '#/components/schemas/BagPhase'
        bhs-ebs-in:
          $ref: '#/components/schemas/BagPhase'
        bhs-ebs-out:
          $ref: '#/components/schemas/BagPhase'
        bhs-mup:
          $ref: '#/components/schemas/BagPhase'
        bhs-processing:
          $ref: '#/components/schemas/BagPhase'
        bhs-reclaim:
          $ref: '#/components/schemas/BagPhase'
        aircraft-landed:
          $ref: '#/components/schemas/BagPhase'
        bag-clear:
          $ref: '#/components/schemas/BagPhase'
        bag-driving:
          $ref: '#/components/schemas/BagPhase'
        bag-offloaded:
          $ref: '#/components/schemas/BagPhase'
        bag-reclaim:
          $ref: '#/components/schemas/BagPhase'
        mup-bulk:
          $ref: '#/components/schemas/BagPhase'
        mup-uld:
          $ref: '#/components/schemas/BagPhase'
        aircraft-air:
          $ref: '#/components/schemas/BagPhase'
        bag-aircraft:
          $ref: '#/components/schemas/BagPhase'
        bag-bay:
          $ref: '#/components/schemas/BagPhase'
        passenger-bag:
          $ref: '#/components/schemas/BagPhase'
        uld-aircraft:
          $ref: '#/components/schemas/BagPhase'
        uld-bay:
          $ref: '#/components/schemas/BagPhase'
        uld-off-loaded:
          $ref: '#/components/schemas/BagPhase'
        bag-tralat:
          $ref: '#/components/schemas/BagPhase'
        uld-reclaim:
          $ref: '#/components/schemas/BagPhase'
        bhs-mes:
          $ref: '#/components/schemas/BagPhase'
    LoadIntoUldActivity:
      type: object
      description: BagActivity for ULD load/unload.
      properties:
        location-type:
          type: string
          description: Type of location.
          enum:
          - SEGMENT
          - OUTBOUND
          - INBOUND
        timestamp:
          type: string
          format: date-time
          description: Timestamp in UTC.
        location:
          type: string
          description: Location.
        uld-tag:
          type: string
          deprecated: true
          description: ULD tag . Deprecated - use containerTag instead.
        container-tag:
          type: string
          description: Container tag.
          example: A12345678
        container-type:
          type: string
          description: Container type like ULD/dolly/aircraft. The activity is dependent to this type.
          example: ULD
        container-activity:
          type: string
          description: Container activity.
          enum:
          - LOAD
          - OFFLOAD
          - REMOVE
          - MERGE
    BagCheckInEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_CHECK_IN_EVENT
          bag-segments:
            type: array
            description: 'bag segments. Additional constraints apply: Must contain between 1 and 15 segments. Difference in origin-date of first and last segment must be no more than 30 days, event-time must be no more than 30 days before first segment and no more than 3030 days after last segment.'
            items:
              $ref: '#/components/schemas/BagSegment'
            maxItems: 15
            minItems: 1
          authorized-to-load:
            type: boolean
            description: Authorized to load that comes with BSM reconciliation data element.
            example: true
          authorized-to-transport:
            type: boolean
            description: Authorized to transport that comes with BSM reconciliation data element.
            example: false
          exception:
            type: string
            description: 'Exceptions: RUSH, GATE, etc.'
            example: GATE;
      description: Entity for Bag Check-In Business Events.
      required:
      - bag-segments
      - event-time
      - event-type
      - source
      - tag
    BagActivities:
      type: object
      description: Information on performed BagActivities on a bag segment.
      properties:
        check-in:
          $ref: '#/components/schemas/BagActivity'
          description: Check-in.
        cancel:
          $ref: '#/components/schemas/BagActivity'
          description: Cancel.
        reflight:
          $ref: '#/components/schemas/BagActivity'
          description: Reflight.
        reroute:
          $ref: '#/components/schemas/BagActivity'
          description: Reroute.
        screening:
          $ref: '#/components/schemas/ScreeningActivity'
          description: Screening.
        bhs-induction:
          $ref: '#/components/schemas/BagActivity'
          description: BHS_INDUCTION.
        atr:
          $ref: '#/components/schemas/BagActivity'
          description: ATR.
        bvs:
          $ref: '#/components/schemas/BagActivity'
          description: BVS.
        mes:
          $ref: '#/components/schemas/BagActivity'
          description: MES.
        ebs-in:
          $ref: '#/components/schemas/BagActivity'
          description: Early bag store in.
        ebs-out:
          $ref: '#/components/schemas/BagActivity'
          description: Early bag store out.
        mup-discharge:
          $ref: '#/components/schemas/BagActivity'
          description: MUP discharge.
        depart-mup:
          $ref: '#/components/schemas/BagActivity'
          description: Depart from MUP.
        arrive-bay:
          $ref: '#/components/schemas/BagActivity'
          description: Arrive at bay.
        depart-bay:
          $ref: '#/components/schemas/BagActivity'
          description: Depart from bay.
        arrive-transfer-lateral:
          $ref: '#/components/schemas/BagActivity'
          description: Arrive at transfer lateral.
        arrive-reclaim-belt:
          $ref: '#/components/schemas/BagActivity'
          description: Arrive at reclaim belt.
        load-into-uld:
          $ref: '#/components/schemas/LoadIntoUldActivity'
          description: Load into uld.
        unload-uld:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Unload from uld.
        remove-from-uld:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Remove from uld.
        remove-from-aircraft:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Remove from aircraft.
        reconciled:
          $ref: '#/components/schemas/BagActivity'
          description: Reconcilation.
        unload:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Unload from aircraft.
        delivered:
          $ref: '#/components/schemas/BagActivity'
          description: Delivery confirmed.
        load-into-aircraft:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Load into aircraft.
        merge:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Load into aircraft.
        induct-reclaim-belt:
          $ref: '#/components/schemas/BagActivity'
          description: Bag place on arrival Belt.
        risk-level:
          $ref: '#/components/schemas/BagActivity'
          description: Bag Risk Level Calculated.
    BagEvent:
      type: object
      description: Entity for bag Business Events. Use concrete subclass.
      discriminator:
        propertyName: event-type
      oneOf:
      - $ref: '#/components/schemas/BagCheckInEvent'
      - $ref: '#/components/schemas/BagCancelEvent'
      - $ref: '#/components/schemas/BagChangeEvent'
      - $ref: '#/components/schemas/BagReRouteEvent'
      - $ref: '#/components/schemas/BagReFlightEvent'
      - $ref: '#/components/schemas/BagTrackingEvent'
      - $ref: '#/components/schemas/BagScreeningEvent'
      - $ref: '#/components/schemas/BagLoadIntoUldEvent'
      - $ref: '#/components/schemas/BagContainerizationEvent'
      properties:
        meta:
          $ref: '#/components/schemas/BasicMeta'
          description: Event metadata, generated by DataHub. May not be passed in.
          readOnly: true
        event-type:
          type: string
          description: Type of event, must match the type defined for the concrete subclass.
        event-time:
          type: string
          format: date-time
          description: Timestamp when the event occurred in UTC.
        location:
          type: string
          description: Location id where the event occured.
          example: TRA_12
        source:
          type: string
          description: System generating the event.
          example: Scanner TRA_12
        bag-id:
          type: string
          description: Unique id for the bag. Can be used for an unlimited period of time.
          example: EK0123-20250212-HKG-DXB-0123456789
        secondary-identifiers:
          type: array
          description: Additionally identifiers used by BHS etc.
          items:
            $ref: '#/components/schemas/BagTagIdentifier'
          uniqueItems: true
        tag:
          type: string
          description: Tag number of the bag tag. Latest tag number in case of re-tagging. Must not start or end with space.
          example: Tag1234
        previous-segments:
          type: array
          description: Previous segments.
          items:
            $ref: '#/components/schemas/BagSegment'
        inbound-segment:
          $ref: '#/components/schemas/BagSegment'
          description: Inbound segment.
        outbound-segment:
          $ref: '#/components/schemas/BagSegment'
          description: Outbound segment.
        onward-segments:
          type: array
          description: Onward segments.
          items:
            $ref: '#/components/schemas/BagSegment'
        bag-type:
          type: string
          description: Bag type identifier.
          example: Hard Shell
        passenger:
          $ref: '#/components/schemas/Passenger'
          description: Passenger information for the bag.
        sourceId:
          type: string
        adhId:
          type: string
        correlationId:
          type: string
        passenger-status:
          type: string
          description: Passenger Status
        direction:
          type: string
          description: The direction of the bag.
          enum:
          - INBOUND
          - OUTBOUND
          - TRANSFER
      required:
      - event-time
      - event-type
      - source
      - tag
    BagTag:
      type: object
      description: Object holding the state of a bag journey represented by bag tag.
      properties:
        meta:
          $ref: '#/components/schemas/AggregatedMeta'
          description: Metadata, generated by ADH.
          readOnly: true
        bag-tag-id:
          type: string
          description: Unique id of the bag tag in the data hub for an unlimited period of time.
          example: ABCD-1234
        merged-bag-tag-id:
          type: array
          description: Unique IDs of bag tags that have ended their life cycle and are merged into this one.
          items:
            type: string
          uniqueItems: true
        tag:
          type: string
          description: Tag number of the bag tag. Latest tag number in case of re-tagging.
          example: B12345678
        secondary-identifiers:
          type: array
          description: Additional identifiers for the bag tag used by BHS etc.
          items:
            $ref: '#/components/schemas/BagTagIdentifier'
          uniqueItems: true
        bag-type:
          type: string
          description: Bag type identifier.
          example: Hard Shell
        passenger:
          $ref: '#/components/schemas/Passenger'
          description: Passenger information for the bag.
        bag-segments:
          type: array
          deprecated: true
          description: Bag segments.
          items:
            $ref: '#/components/schemas/BagSegment'
        inbound-segment:
          $ref: '#/components/schemas/BagSegment'
          description: Inbound segment.
        outbound-segment:
          $ref: '#/components/schemas/BagSegment'
          description: Outbound segment.
        direction:
          type: string
          description: Direction that characterizes a bag tag
          enum:
          - INBOUND
          - OUTBOUND
          - TRANSFER
          example: INBOUND, OUTBOUND, TRANSFER
        runningAirportIataCode:
          type: string
        onward-segments:
          type: array
          description: Onward segments.
          items:
            $ref: '#/components/schemas/BagSegment'
        previous-segments:
          type: array
          description: Previous segments.
          items:
            $ref: '#/components/schemas/BagSegment'
        bag-risk:
          $ref: '#/components/schemas/BagTagRiskLevel'
        bag-journey:
          $ref: '#/components/schemas/BagJourney'
        global-state:
          type: string
          description: Global state of the bag tag, ACTIVE, COMPLETED or DELETED. It has into account inbound and outbound segment
          enum:
          - ACTIVE
          - COMPLETED
          - DELETED
          example: ACTIVE
    BagPhase:
      type: object
      properties:
        estimated-time:
          type: string
          format: date-time
        actual-time:
          type: string
          format: date-time
    BasicMeta:
      type: object
      description: Metadata of DH objects.
      properties:
        created-at:
          type: string
          format: date-time
          description: Timestamp when object was first created in DH.
          readOnly: true
        created-by:
          $ref: '#/components/schemas/User'
          description: ID of user of event which caused the object to be created.
          readOnly: true
        modified-count:
          type: integer
          format: int64
          description: Number of modifications in DH.
          readOnly: true
        modified-at:
          type: string
          format: date-time
          description: Timestamp of last modification in DH.
          readOnly: true
        modified-by:
          $ref: '#/components/schemas/User'
          description: ID of user of event which caused the object to be modified.
          readOnly: true
        tag-id:
          type: string
          deprecated: true
          description: Unique id of the bag tag in the data hub for an unlimited period of time.
        skip-datawarehouse:
          type: boolean
          description: Skip Datawarehouse processing.
          readOnly: true
        skip-report-flight:
          type: boolean
          description: Skip Report Flight processing.
          readOnly: true
      readOnly: true
    BagTagRiskLevel:
      type: object
      properties:
        standard-operating-procedure:
          $ref: '#/components/schemas/BagRisk'
          description: Standard Operating Procedure Risk Level
        minimum-connecting-time:
          $ref: '#/components/schemas/BagRisk'
          description: Minimum Connecting Time Risk level.
        quick-chute:
          $ref: '#/components/schemas/BagRisk'
          description: Quick Chute Risk Level.
