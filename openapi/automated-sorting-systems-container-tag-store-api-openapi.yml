        event-type:
          type: string
          description: Type of event, must match the type defined for the concrete subclass.
        container-id:
          type: string
          description: Unique id for the container. Can be used for an unlimited period of time.
        tag:
          type: string
          description: Tag number of the container for the current journey/usage .
          example: AKE12345678
        secondary-identifiers:
          type: array
          description: Additionally identifiers for the container journey/usage used by airports etc.
          items:
            $ref: '#/components/schemas/SecondaryIdentifier'
          uniqueItems: true
