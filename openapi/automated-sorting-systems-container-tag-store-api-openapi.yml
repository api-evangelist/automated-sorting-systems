openapi: 3.2.0
info:
  title: Datahub Container Tag Store API
  description: OpenAir Datahub acts as a central data repository for all functions, which affect the efficient functioning of an airport. Data can be ingested from various sources via standardized interfaces. The way of getting data out of it is similar; there are standardized REST and MQTT interfaces to fetch the data. The data structure is based on industry standards such as IATA's AIDM and ACI's ACRIS combined with decades of Vanderlande Logistics industry knowledge.
  contact:
    name: Vanderlande Logistics GmbH
    url: https://www.vanderlande.com
    email: info.digital@vanderlande-logistics.com
  license:
    name: Property of Vanderlande Logistics GmbH
  version: 6.6.0
tags:
- name: Container Tag Store
  externalDocs:
    description: The container tag store contains methods to access and insert or modify container tag data.
paths:
  /containertags/events/storage:
    post:
      tags:
      - Container Tag Store
      summary: Post a container storage event
      description: Transfers a container storage event to ADH. This may change the state of the container tag. New data is processed asynchronously and may need some time to be updated.
      operationId: postContainerStorageEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerStorageEvent'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                  additionalProperties:
                    type: object
                - type: object
                  additionalProperties:
                    type: string
      security:
      - aviationdatahub:
        - ADH.CT.W
  /containertags/events/security:
    post:
      tags:
      - Container Tag Store
      summary: Post a container security event
      description: Transfers a container security event to ADH. This may change the state of the container tag. New data is processed asynchronously and may need some time to be updated.
      operationId: postContainerSecurityEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerSecurityEvent'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
