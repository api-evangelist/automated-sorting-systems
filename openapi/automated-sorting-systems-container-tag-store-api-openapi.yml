  /containertags/events/registration:
    post:
      tags:
      - Container Tag Store
      summary: Post a container registration event
      description: Transfers a container registration event to ADH. This may change the state of the container tag. New data is processed asynchronously and may need some time to be updated.
      operationId: postContainerRegistrationEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerRegistrationEvent'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                  additionalProperties:
                    type: object
                - type: object
                  additionalProperties:
                    type: string
      security:
      - aviationdatahub:
        - ADH.CT.W
  /containertags/events/movement:
    post:
      tags:
      - Container Tag Store
      summary: Post a container movement event
      description: Transfers a container movement event to ADH. This may change the state of the container tag. New data is processed asynchronously and may need some time to be updated.
      operationId: postContainerMovementEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerMovementEvent'
        required: true
      responses:
        '200':
          description: OK
        '400':
