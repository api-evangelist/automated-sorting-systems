                - type: object
                  additionalProperties:
                    type: string
      security:
      - aviationdatahub:
        - ADH.CT.W
  /containertags/events/containerization:
    post:
      tags:
      - Container Tag Store
      summary: Post a container containerization event
      description: Transfers a container containerization event to ADH. This may change the state of the container tag. New data is processed asynchronously and may need some time to be updated.
      operationId: postContainerContainerizationEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerContainerizationEvent'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
