    BagContainerizationEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_CONTAINERIZATION_EVENT
          function:
            type: string
            description: Type of event activity.
            enum:
            - LOAD
            - OFFLOAD
            - REMOVE
            - MERGE
          container-tag:
            type: string
            description: Identifier for journey of the Container.
            example: A234223423
          container-type:
            type: string
            description: Container type like ULD/dolly/aircraft.
            example: ULD
          sequence-number:
            type: integer
            format: int32
            description: Loading sequence number of bag into container.
            example: 2
          bag-segments:
            type: array
            description: Segments.
            items:
              $ref: '#/components/schemas/BagSegment'
            maxItems: 15
            minItems: 1
          container-direction:
            type: string
            description: Direction of the container event.
            enum:
            - INBOUND
            - OUTBOUND
            - TRANSFER
            example: inbound
      description: Entity for bag containerization Business Events.
      required:
      - bag-segments
      - event-time
      - event-type
      - function
      - source
      - tag
    BagCheckInEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_CHECK_IN_EVENT
          bag-segments:
            type: array
            description: 'bag segments. Additional constraints apply: Must contain between 1 and 15 segments.
              Difference in origin-date of first and last segment must be no more than 30 days, event-time
              must be no more than 30 days before first segment and no more than 3030 days after last
              segment.'
            items:
              $ref: '#/components/schemas/BagSegment'
            maxItems: 15
            minItems: 1
          authorized-to-load:
            type: boolean
            description: Authorized to load that comes with BSM reconciliation data element.
            example: true
          authorized-to-transport:
            type: boolean
            description: Authorized to transport that comes with BSM reconciliation data element.
            example: false
          exception:
            type: string
            description: 'Exceptions: RUSH, GATE, etc.'
            example: GATE;
      description: Entity for Bag Check-In Business Events.
      required:
      - bag-segments
      - event-time
      - event-type
      - source
      - tag
    BagChangeEvent:
      allOf:
