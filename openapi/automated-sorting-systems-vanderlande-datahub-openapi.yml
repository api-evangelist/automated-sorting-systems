  /bagtags/{id}:
    get:
      tags:
      - Bag Tag Store
      summary: Query bag tag by unique bag-tag-id provided by adh.
      operationId: getBagTagREST
      parameters:
      - name: id
        in: path
        description: The unique bag-tag-id provided by adh. Searches for this in bag-tag-id or merged-bag-tag-id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Ok: Default response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BagTag'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModelAndView'
        '404':
          description: 'Not Found: bag tag with given id not found.'
      security:
      - aviationdatahub:
        - ADH.BT.R
  /bagtags/{id}/segments:
    get:
      tags:
      - Bag Tag Store
      summary: Query bag tags by flight segment for given bag tag id based on given search criteria.
      description: If no query parameter is set the search will be reduced to the last 24 hours. If no
        maxResult is set a maximum of 1000 records will be returned.
      operationId: queryFlightSegmentBagTagsForBagTag
      parameters:
      - name: id
        in: path
        description: The unique bag-tag-id provided by adh. Searches for this in bag-tag-id or merged-bag-tag-id.
        required: true
        schema:
          type: string
      - name: tag
        in: query
        description: The tag number of the bag tag.
        required: false
        schema:
          type: string
      - name: carrier
        in: query
        description: The iata code of the operating carrier.
        required: false
        schema:
          type: string
      - name: flight-number
        in: query
        description: The (numeric) flight number of operating airline.
        required: false
        schema:
          type: string
      - name: operational-suffix
        in: query
        description: Used to distinguish two flights having the same flight number and departing from
          their respective origin stations on the same date.
        required: false
        schema:
          type: string
      - name: origin-date
        in: query
        description: The day of operation, i.e. local day of schedule off-block time in UTC at first departure
          airport of flight. e.g. 2020-01-31T12:30:00.000Z.
        required: false
        schema:
          type: string
      - name: origin-iata-code
        in: query
        description: The iata code of an airport as origin airport of a flight leg the bag is booked on.
        required: false
        schema:
          type: string
      - name: destination-iata-code
        in: query
        description: The iata code of an airport as destination airport of a flight leg the bag is booked
          on.
        required: false
        schema:
          type: string
      - name: created-from
        in: query
        description: 'Object creation time by ADH: the start point of the interval in UTC (included).
          e.g. 2020-01-31T12:30:00.000Z.'
        required: false
        schema:
          type: string
      - name: created-to
        in: query
        description: 'Object creation time by ADH: the end point of the interval in UTC (excluded). e.g.
          2020-01-31T12:30:00.000Z.'
        required: false
        schema:
          type: string
      - name: updated-from
        in: query
        description: 'Last object modification time by ADH: the start point of the interval in UTC (included).
          e.g. 2020-01-31T12:30:00.000Z.'
        required: false
        schema:
          type: string
      - name: updated-to
        in: query
        description: 'Last object modification time by ADH: the end point of the interval in UTC (excluded).
          e.g. 2020-01-31T12:30:00.000Z.'
        required: false
        schema:
          type: string
      - name: secondary-identifier
        in: query
        description: A secondary identifier given to the bag tag.
        required: false
        schema:
          type: string
      - name: max-results
        in: query
        description: The maximum number of results.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlightSegmentBagTag'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModelAndView'
      security:
      - aviationdatahub:
        - ADH.BT.R
  /bagtags/{id}/events:
    get:
      tags:
      - Bag Tag Store
      summary: Query bag events for given bag tag id based on given search criteria.
      description: If no query parameter is set the search will be reduced to the last 24 hours. If no
        maxResult is set a maximum of 1000 records will be returned.
      operationId: queryBagEventsForBagTag
      parameters:
      - name: id
        in: path
        description: The unique bag-tag-id provided by adh. Searches for this in bag-tag-id or merged-bag-tag-id.
        required: true
        schema:
          type: string
      - name: tag
        in: query
        description: The tag number of the bag tag.
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: The start point of the interval in UTC. e.g. 2020-01-31T12:30:00.000Z. If used the
          from and the to parameter has to be set.
        required: false
        schema:
          type: string
      - name: to
        in: query
        description: The end point of the interval in UTC. e.g. 2020-01-31T12:30:00.000Z. If used the
          from and the to parameter has to be set.
        required: false
        schema:
          type: string
      - name: carrier
        in: query
        description: The iata code of the operating carrier.
        required: false
        schema:
          type: string
      - name: flight-number
        in: query
        description: The (numeric part of) flight number of operating airline.
        required: false
        schema:
          type: string
      - name: operational-suffix
        in: query
        description: Used to distinguish two flights having the same flight number and departing from
          their respective Origin Stations on the same date.
        required: false
        schema:
          type: string
      - name: origin-date
        in: query
        description: The day of operation, i.e. local day of schedule off-block time in UTC at first departure
          airport of flight. e.g. 2020-01-31T12:30:00.000Z.
        required: false
        schema:
          type: string
      - name: origin-iata-code
        in: query
        description: The iata code of the departure airport.
        required: false
        schema:
          type: string
      - name: destination-iata-code
        in: query
        description: The iata code of the arrival airport.
        required: false
        schema:
          type: string
      - name: event-type
        in: query
        description: The event type.
        required: false
        schema:
          type: string
          enum:
          - BAG_CHECK_IN_EVENT
          - BAG_CANCEL_EVENT
          - BAG_CHANGE_EVENT
          - BAG_ROUTE_EVENT
          - BAG_REFLIGHT_EVENT
          - BAG_CONTAINERIZATION_EVENT
          - BAG_TRACKING_EVENT
          - BAG_SCREENING_EVENT
          - BAG_LOAD_INTO_ULD_EVENT
      - name: tracking-event-sub-type
        in: query
        description: The tracking event sub-type.
        required: false
        schema:
          type: string
          enum:
          - BHS_INDUCTION
          - ATR
          - MES
          - BVS
          - EBS_IN
          - EBS_OUT
          - MUP_DISCHARGE
          - RECONCILED
          - CART_LOAD
          - LOAD
          - DEPARTED_FROM_MUP
          - ARRIVED_AT_BAY
          - DEPARTED_FROM_BAY
          - ARRIVED_AT_TRANSFER_LATERAL
          - ARRIVED_AT_RECLAIM_BELT
          - UNLOAD
          - ULD_UNLOAD
          - RECLAIM_BELT_INDUCTION
          - DELIVERED
      - name: secondary-identifier
        in: query
        description: A secondary identifier given to the bag tag.
        required: false
        schema:
          type: string
      - name: container-tag
        in: query
        description: Tag of the a container to search for.
        required: false
        schema:
          type: string
      - name: location
        in: query
        description: Location of the container event to search for.
        required: false
        schema:
          type: string
      - name: source
        in: query
        description: Source of the container event to search for.
        required: false
        schema:
          type: string
      - name: max-results
        in: query
        description: The maximum number of results.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BagEvent'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ModelAndView'
      security:
      - aviationdatahub:
        - ADH.BT.R
