            acquire-at-mup:
              $ref: '#/components/schemas/ContainerMovementActivity'
              description: Acquire at MUP.
            deliver-at-store:
              $ref: '#/components/schemas/ContainerMovementActivity'
              description: Deliver at store.
            receipt:
              $ref: '#/components/schemas/ContainerStorageActivity'
              description: Receipt at store.
            put-away:
              $ref: '#/components/schemas/ContainerStorageActivity'
              description: Put away at store.
            withdraw:
              $ref: '#/components/schemas/ContainerStorageActivity'
              description: Withdraw from store.
            acquire-at-store:
              $ref: '#/components/schemas/ContainerMovementActivity'
              description: Acquire at store.
            deliver-at-bay:
              $ref: '#/components/schemas/ContainerMovementActivity'
              description: Deliver at bay.
