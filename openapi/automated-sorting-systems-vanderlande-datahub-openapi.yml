          - CANCELLED
          - OFF_BLOCK
          - DEPARTED
          - LANDED
          - IN_BLOCK
        sourceId:
          type: string
        adhId:
          type: string
        correlationId:
          type: string
        secondary-identifiers:
          type: array
          description: Additionally identifiers used by BHS etc.
          items:
            $ref: '#/components/schemas/SecondaryIdentifier'
          uniqueItems: true
      required:
      - event-time
      - event-type
      - identifier
      - source
