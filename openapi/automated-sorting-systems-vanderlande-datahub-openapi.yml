          description: .R element
          example: SCANNED
          items:
            type: string
        security-screening:
          $ref: '#/components/schemas/SecurityScreening'
          description: .X element
          example: .X/SEL
      required:
      - bag-ids
      - version-data
    FlightDataBpm:
      type: object
      properties:
        flight-designator:
          type: string
          description: Airline and Flight Number
          example: UA423
        origin-date:
          type: string
          description: Scheduled date for departure date. Format is YYYY-MM-DD.
          example: '2023-03-30'
        carrier:
          type: string
          description: The flight carrier
          example: UA
        flight-number:
          type: string
          description: The flight number
          example: 423
        operational-suffix:
          type: string
          example: A
        origin-iata-code:
          type: string
          description: Origin Airport IATA code
          example: SIN
        destination-iata-code:
          type: string
          description: Destination Airport IATA code
          example: DXB
        class-of-travel:
          type: string
          description: Y, F, etc.
          example: F
        sequence-number:
          type: integer
          format: int32
          description: Sequence Flight Number
          example: 1
    ProcessingInfo:
      type: object
      properties:
        secondary-code:
          type: string
          description: Secondary Code
          enum:
          - G
          - R
          - S
          - H
          example: R
        agent-identification:
          type: string
          description: Agent Identification
          example: 43S
        scanner-identification:
          type: string
          description: Scanner Identification
          example: 120D32
        date-time:
          type: string
          format: date-time
          description: Date (DDMMM) combined with Time (HHMMSS; L=local; Z=UTC)
          example: 09MAR 154512L
        time-zone-indicator:
          type: string
          description: Time zone indicator retrieved from time field in .J element
          enum:
          - L
          - Z
        reading-location:
          type: string
          description: Reading Location
          example: B2
        sent-to-location:
          type: string
          description: Sent to Location
          example: RI
      required:
      - secondary-code
    Fblb:
      type: object
      properties:
        fb-dt:
          type: string
          format: date-time
          description: Timestamp when the first bag was processed
        lb-dt:
          type: string
          format: date-time
          description: Timestamp when the last bag was processed
        fb-aibt:
          type: integer
          format: int32
          description: Duration in seconds between first bag date time and actual in block time.
        lb-aibt:
          type: integer
          format: int32
          description: Duration in seconds between last bag date time and actual in block time.
        read-rate:
          type: number
          format: float
          description: Percentage of bags that arrived at reclaim belt from the all virtual bags
        tags-checked-in:
          type: array
          items:
            type: string
          uniqueItems: true
        total-bags-check-in:
          type: integer
          format: int32
          description: Number of bags that were checked in
        tags-at-reclaim-belt:
          type: array
          description: A list of all the bags tags that were processed for that flight
          items:
            type: string
          uniqueItems: true
        total-bags-reclaim-belt:
          type: integer
          format: int32
          description: Number of bags that arrived at reclaim belt for that flight
        tags-missing:
          type: array
          description: A list of all the bags tags that were checked in but did not arrived at reclaim
            belt
          items:
            type: string
          uniqueItems: true
        total-bags-missing:
          type: integer
          format: int32
          description: Number of bags that arrived at reclaim belt for that flight
        tags-unexpected:
          type: array
          description: A list of all the bags tags that arrived at reclaim belt but were not checked in
          items:
            type: string
          uniqueItems: true
        total-bags-unexpected:
          type: integer
          format: int32
          description: Number of bags that were checked in
        fb-tag:
          type: string
        lb-tag:
          type: string
        tags-details:
          type: array
          items:
            $ref: '#/components/schemas/FblbBag'
        read-rate-expected:
          type: number
          format: float
          description: Percentage of bags that arrived at reclaim belt from the checked-in bags
    FblbBag:
      type: object
      properties:
        bag-tag:
          type: string
        class-of-travel:
          type: string
        uld-tag:
          type: string
        reclaim-unit:
          type: string
        is-first-bag:
          type: boolean
        is-last-bag:
          type: boolean
        reclaim-belt-time:
          type: string
          format: date-time
    ReportFlight:
      type: object
      description: Object holding the state of a report flight.
      properties:
        identifier-string:
          type: string
          description: Automatically generated unique flight ID using format CARRIERFLIGHTNUMBER-OPERATIONALSUFFIX-DATE-ORIGIN-DESTINATION.
        fblb:
          $ref: '#/components/schemas/Fblb'
          description: 'First-bag last-bag report. '
        flight-leg:
          $ref: '#/components/schemas/FlightLeg'
          description: The flight leg business object.
        originDate:
          type: string
          format: date
          writeOnly: true
        aibt:
          type: string
          format: date-time
        meta:
          $ref: '#/components/schemas/AggregatedMeta'
          description: Metadata, generated by ADH.
          readOnly: true
      required:
      - flight-leg
      - identifier-string
