  /containertags/{id}/events:
    get:
      tags:
      - Container Tag Store
      summary: Query container events based on given search criteria.
      description: If no query parameter is set the search will be reduced to the last 24 hours. If no
        maxResult is set a maximum of 1000 records will be returned.
      operationId: queryContainerEventsForContainerTag
      parameters:
      - name: id
        in: path
        description: The unique container tag-id provided by adh.
        required: true
        schema:
          type: string
      - name: tag
        in: query
        description: The tag number of the container tag.
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: The start point of the interval in UTC. e.g. 2020-01-31T12:30:00.000Z. If used the
          from and the to parameter has to be set.
        required: false
        schema:
          type: string
      - name: to
        in: query
        description: The end point of the interval in UTC. e.g. 2020-01-31T12:30:00.000Z. If used the
          from and the to parameter has to be set.
        required: false
        schema:
          type: string
      - name: carrier
        in: query
        description: IATA code of the operating carrierv.
        required: false
        schema:
          type: string
      - name: flight-number
        in: query
        description: The (numeric part of) flight number of operating airlinev.
        required: false
        schema:
          type: string
      - name: operational-suffix
        in: query
        description: Used to distinguish two flights having the same flight number and departing from
          their respective Origin Stations on the same date.
        required: false
        schema:
          type: string
      - name: origin-date
        in: query
        description: The day of operation, i.e. local day of schedule off-block time in UTC at first departure
          airport of flight. e.g. 2020-01-31T12:30:00.000Z.
        required: false
        schema:
          type: string
      - name: origin-iata-code
        in: query
        description: The IATA code of the departure airport.
        required: false
        schema:
          type: string
      - name: destination-iata-code
        in: query
        description: The IATA code of the arrival airport.
        required: false
        schema:
          type: string
      - name: event-type
        in: query
        description: 'The event type: '
        required: false
        schema:
          type: string
          enum:
          - CONTAINERIZATION
          - MOVEMENT
          - REGISTRATION
          - SECURITY
          - STORAGE
      - name: event-function
        in: query
        description: 'The event function: '
        required: false
        schema:
          type: string
          enum:
          - LOAD
          - OFFLOAD
          - REMOVE
          - ACQUIRE
          - TRACK
          - DELIVER
          - REGISTER
          - SCREEN
          - CLOSE
          - OPEN
          - SEAL
          - UNSEAL
          - RECEIPT
          - PUT_AWAY
          - WITHDRAW
      - name: secondary-identifier
        in: query
        description: A secondary identifier given to the container tag.
        required: false
        schema:
          type: string
      - name: location
        in: query
        description: Location of the event to search for.
        required: false
        schema:
          type: string
      - name: source
        in: query
        description: Source of the event to search for.
        required: false
        schema:
          type: string
      - name: max-results
        in: query
        description: The maximum number of results.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: '#/components/schemas/ContainerEvent'
                  - $ref: '#/components/schemas/ContainerContainerizationEvent'
                  - $ref: '#/components/schemas/ContainerMovementEvent'
                  - $ref: '#/components/schemas/ContainerRegistrationEvent'
                  - $ref: '#/components/schemas/ContainerSecurityEvent'
                  - $ref: '#/components/schemas/ContainerStorageEvent'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                  additionalProperties:
                    type: object
                - type: object
                  additionalProperties:
                    type: string
