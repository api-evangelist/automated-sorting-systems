    FlightEvent:
      type: object
      description: Entity for Business Events for flights. Always use one of the subtypes.
      discriminator:
        propertyName: event-type
      oneOf:
      - $ref: '#/components/schemas/FlightScheduledEvent'
      - $ref: '#/components/schemas/FlightAircraftAllocationEvent'
      - $ref: '#/components/schemas/FlightTimeEvent'
      - $ref: '#/components/schemas/FlightCancelledEvent'
      - $ref: '#/components/schemas/GateResourceEvent'
      - $ref: '#/components/schemas/AircraftParkingPositionResourceEvent'
      - $ref: '#/components/schemas/AircraftTerminalResourceEvent'
      - $ref: '#/components/schemas/BaggageClaimUnitResourceEvent'
      - $ref: '#/components/schemas/BaggageMakeUpBeltResourceEvent'
      - $ref: '#/components/schemas/BaggageTransferLateralResourceEvent'
      - $ref: '#/components/schemas/CheckInDesksResourceEvent'
      - $ref: '#/components/schemas/FlightAssembledEvent'
      - $ref: '#/components/schemas/FlightPaxCountEvent'
      properties:
        meta:
          $ref: '#/components/schemas/BasicMeta'
          description: Event metadata, generated by DataHub. May not be passed in.
          readOnly: true
        event-type:
          type: string
          description: Type of event, must match the type defined for the concrete subclass.
        event-time:
          type: string
          format: date-time
          description: Timestamp when the event occurred in UTC.
        location:
          type: string
          description: Location id where the event occured.
          example: TRA_12
        source:
          type: string
          description: System generating the event.
          example: Scanner TRA_12
        identifier:
          $ref: '#/components/schemas/FlightIdentifier'
          description: 'identifying properties of flight leg. Additional constraints apply: The event-time
            must be in the range of 180 days before and 180 days after origin-date'
        identifier-string:
          type: string
