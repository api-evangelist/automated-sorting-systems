        - ADH.BT.R
        - ADH.AR.R
        - ADH.CT.R
        - ADH.FL.R
  /reportflight/:
    get:
      tags:
      - Report Flight Store
      summary: Query report flight based on given search criteria.
      description: If no query parameter is set the search will be reduced to the last 24 hours. If no
        maxResult is set a maximum of 1000 records will be returned.
      operationId: queryReportFlight
      parameters:
      - name: carrier
        in: query
        description: IATA 2-digit code of the operating carrier.
        required: false
        schema:
          type: string
      - name: flight-number
        in: query
        description: The numeric flight number of operating airline.
        required: false
        schema:
          type: string
      - name: operational-suffix
        in: query
        description: Used to distinguish two flights having the same flight number and departing from
          their respective origin stations on the same date.
        required: false
        schema:
          type: string
      - name: origin-date
        in: query
        description: The day of operation, i.e. local day of schedule off-block time in UTC at first departure
          airport of flight.
        required: false
        schema:
          type: string
      - name: origin-iata-code
        in: query
        description: The IATA code of an airport as origin airport of a flight leg.
        required: false
        schema:
          type: string
      - name: destination-iata-code
        in: query
        description: The IATA code of an airport as destination airport of a flight leg.
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: The (included) start point of the interval in UTC for the scheduled departure/ arrival
          time depending on values for origin/ destination airport. e.g. 2020-01-31T12:30:00.000Z. If
          used the from and the to parameter has to be set.
        required: false
        schema:
          type: string
      - name: to
        in: query
        description: The (excluded) end point of the interval in UTC for the scheduled departure/ arrival
          time depending on values for origin/ destination airport. e.g. 2020-01-31T12:30:00.000Z. If
          used the from and the to parameter has to be set.
        required: false
        schema:
          type: string
      - name: max-results
        in: query
        description: The maximum number of results.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportFlight'
      security:
      - aviationdatahub:
        - ADH.FL.R
components:
  schemas:
    HttpStatusCode:
      type: object
      properties:
        error:
          type: boolean
        is4xxClientError:
          type: boolean
        is5xxServerError:
          type: boolean
        is1xxInformational:
          type: boolean
        is2xxSuccessful:
          type: boolean
        is3xxRedirection:
          type: boolean
    ModelAndView:
      type: object
      properties:
        view:
          $ref: '#/components/schemas/View'
        model:
          type: object
          additionalProperties:
            type: object
        status:
          $ref: '#/components/schemas/HttpStatusCode'
        empty:
          type: boolean
        viewName:
          type: string
        reference:
          type: boolean
        modelMap:
          type: object
          additionalProperties:
            type: object
          properties:
            empty:
              type: boolean
    View:
      type: object
      properties:
        contentType:
          type: string
    BagActivities:
      type: object
      description: Information on performed BagActivities on a bag segment.
      properties:
        check-in:
          $ref: '#/components/schemas/BagActivity'
          description: Check-in.
        cancel:
          $ref: '#/components/schemas/BagActivity'
          description: Cancel.
        reflight:
          $ref: '#/components/schemas/BagActivity'
          description: Reflight.
        reroute:
          $ref: '#/components/schemas/BagActivity'
          description: Reroute.
        screening:
          $ref: '#/components/schemas/ScreeningActivity'
          description: Screening.
        bhs-induction:
          $ref: '#/components/schemas/BagActivity'
          description: BHS_INDUCTION.
        atr:
          $ref: '#/components/schemas/BagActivity'
          description: ATR.
        bvs:
          $ref: '#/components/schemas/BagActivity'
          description: BVS.
        mes:
          $ref: '#/components/schemas/BagActivity'
          description: MES.
        ebs-in:
          $ref: '#/components/schemas/BagActivity'
          description: Early bag store in.
        ebs-out:
          $ref: '#/components/schemas/BagActivity'
          description: Early bag store out.
        mup-discharge:
          $ref: '#/components/schemas/BagActivity'
          description: MUP discharge.
        depart-mup:
          $ref: '#/components/schemas/BagActivity'
          description: Depart from MUP.
        arrive-bay:
          $ref: '#/components/schemas/BagActivity'
          description: Arrive at bay.
        depart-bay:
          $ref: '#/components/schemas/BagActivity'
          description: Depart from bay.
        arrive-transfer-lateral:
          $ref: '#/components/schemas/BagActivity'
          description: Arrive at transfer lateral.
        arrive-reclaim-belt:
          $ref: '#/components/schemas/BagActivity'
          description: Arrive at reclaim belt.
        load-into-uld:
          $ref: '#/components/schemas/LoadIntoUldActivity'
          description: Load into uld.
        unload-uld:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Unload from uld.
        remove-from-uld:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Remove from uld.
        remove-from-aircraft:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Remove from aircraft.
        reconciled:
          $ref: '#/components/schemas/BagActivity'
          description: Reconcilation.
        unload:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Unload from aircraft.
        delivered:
          $ref: '#/components/schemas/BagActivity'
          description: Delivery confirmed.
        load-into-aircraft:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Load into aircraft.
        merge:
          $ref: '#/components/schemas/ContainerizationActivity'
          description: Load into aircraft.
        induct-reclaim-belt:
          $ref: '#/components/schemas/BagActivity'
          description: Bag place on arrival Belt.
        risk-level:
          $ref: '#/components/schemas/BagActivity'
          description: Bag Risk Level Calculated.
    BagActivity:
      type: object
      description: Details on a specific bag activity on a bag segment.
      properties:
        location-type:
          type: string
          description: Type of location.
          enum:
          - SEGMENT
          - OUTBOUND
          - INBOUND
        timestamp:
          type: string
          format: date-time
          description: Timestamp in UTC.
        location:
          type: string
          description: Location.
    BagSegment:
      type: object
      description: Object holding a the state of a bag represented by bag tag for a flight segment.
      properties:
        sequence-number:
          type: integer
          format: int32
          description: Sequence number of bag segment within bag journey.
        tag:
          type: string
          description: Tag number of the bag tag used on this segment.
          example: B12345678
        class-of-travel:
          type: string
          description: Class of travel.
          example: M
        is-rush-bag:
          type: boolean
          description: Flags if this is a rush bag.
        passenger-is-crew-member:
          type: boolean
          description: Flags if bag belongs to a crew member. Put false or 0 to set it to non-crew member.
            Everything greater than 0 will be interpreted as true.
        bag-activities:
          $ref: '#/components/schemas/BagActivities'
          description: Activities captured for this bag.
        oldest-inbound-activity-type:
          type: string
          description: Type of oldest inbound activity.
        oldest-inbound-activity:
          $ref: '#/components/schemas/BagActivity'
          description: Oldest inbound activity.
        newest-inbound-activity-type:
          type: string
          description: Type of newest inbound activity.
        newest-inbound-activity:
          $ref: '#/components/schemas/BagActivity'
          description: Newest inbound activity.
        oldest-outbound-activity-type:
          type: string
          description: Type of oldest outbound activity.
        oldest-outbound-activity:
          $ref: '#/components/schemas/BagActivity'
          description: Oldest outbound activity.
        newest-outbound-activity-type:
          type: string
          description: Type of newest outbound activity.
        newest-outbound-activity:
          $ref: '#/components/schemas/BagActivity'
          description: Newest outbound activity.
        identifier:
          $ref: '#/components/schemas/FlightIdentifier'
          description: Bag segment identifier.
        newest-activity-type:
          type: string
          description: Newest activity type either outbound, inbound or segment
        state:
          type: string
          description: 'State of the bag segment. '
          enum:
          - ACTIVE
          - COMPLETED
          - DELETED
          example: ACTIVE, COMPLETED or DELETED
        enriched:
          type: boolean
          description: Indication if this Bag Segment was Enriched.
      required:
      - identifier
    BagTagIdentifier:
      type: object
      description: Additional identifiers for bag tags used by airport systems etc.
      properties:
        identifier:
          type: string
          description: Internal identifier for the bag.
          example: ABCD-1234
        created:
          type: string
          format: date-time
          description: Timestamp of creation of internal identifier for the bag.
        source:
          type: string
          description: Source creating the internal identifier for the bag.
      required:
      - created
      - identifier
      - source
    BagTrackingEvent:
      allOf:
      - $ref: '#/components/schemas/BagEvent'
      - type: object
        properties:
          event-type:
            type: string
            description: Type of event for the concrete subclass.
            enum:
            - BAG_TRACKING_EVENT
          tracking-point-type:
            type: string
            description: Type of tracking point. Depending on the type use either outbound-segment(BHS_INDUCTION,
              ATR, MES, BVS, EBS_IN, EBS_OUT, MUP_DISCHARGE, RECONCILED, CART_LOAD, LOAD, DEPARTED_FROM_MUP,
              ARRIVED_AT_BAY, ULD_SECURE_STORE_IN, ULD_SECURE_STORE_OUT)or inbound-segment(ATR, DEPARTED_FROM_BAY,
              ARRIVED_AT_TRANSFER_LATERAL, ARRIVED_AT_RECLAIM_BELT, UNLOAD, ULD_UNLOAD, RECLAIM_BELT_INDUCTION,
              DELIVERED, PROBLEM_AREA_DISCHARGE, DEPARTED_FROM_PROBLEM_AREA), never fill both.
            enum:
            - BHS_INDUCTION
            - ATR
            - MES
            - BVS
            - EBS_IN
            - EBS_OUT
            - MUP_DISCHARGE
            - RECONCILED
            - CART_LOAD
            - LOAD
            - DEPARTED_FROM_MUP
            - ARRIVED_AT_BAY
            - ULD_SECURE_STORE_IN
            - ULD_SECURE_STORE_OUT
            - DEPARTED_FROM_BAY
            - ARRIVED_AT_TRANSFER_LATERAL
            - ARRIVED_AT_RECLAIM_BELT
            - UNLOAD
            - ULD_UNLOAD
            - RECLAIM_BELT_INDUCTION
            - DELIVERED
            - PROBLEM_AREA_DISCHARGE
            - DEPARTED_FROM_PROBLEM_AREA
          tracking-state:
            type: string
            description: State of tracking.
            enum:
            - SUCCESS
            - NO_READ
            - TRACKING_LOST
            - MULTIPLE_READ
            - NO_BSM
            - SEND_TO_PROBLEM
          transport-state:
            type: string
            description: State of transport within BHS.
      description: Entity for Bag Tracking Business Events. Be aware that either the inbound or the outbound
        segement needs to be set.
      required:
      - event-time
      - event-type
      - source
      - tag
      - tracking-point-type
    BasicMeta:
      type: object
      description: Metadata of DH objects.
      properties:
        created-at:
          type: string
          format: date-time
          description: Timestamp when object was first created in DH.
          readOnly: true
        created-by:
          $ref: '#/components/schemas/User'
          description: ID of user of event which caused the object to be created.
          readOnly: true
        modified-count:
          type: integer
          format: int64
          description: Number of modifications in DH.
          readOnly: true
        modified-at:
          type: string
          format: date-time
          description: Timestamp of last modification in DH.
          readOnly: true
        modified-by:
          $ref: '#/components/schemas/User'
          description: ID of user of event which caused the object to be modified.
          readOnly: true
        tag-id:
          type: string
          deprecated: true
          description: Unique id of the bag tag in the data hub for an unlimited period of time.
        skip-datawarehouse:
          type: boolean
          description: Skip Datawarehouse processing.
          readOnly: true
        skip-report-flight:
          type: boolean
          description: Skip Report Flight processing.
          readOnly: true
      readOnly: true
    ContainerizationActivity:
      type: object
      description: BagActivity for Containerization.
      properties:
        location-type:
          type: string
          description: Type of location.
          enum:
          - SEGMENT
          - OUTBOUND
          - INBOUND
        timestamp:
          type: string
          format: date-time
          description: Timestamp in UTC.
        location:
          type: string
          description: Location.
        container-tag:
          type: string
          description: Container tag.
          example: A12345678
        container-activity:
          type: string
          description: Container activity.
          enum:
          - LOAD
          - OFFLOAD
          - REMOVE
          - MERGE
        container-type:
          type: string
          description: Container type like ULD/dolly/aircraft. The activity is dependent to this type.
          example: ULD
    FlightIdentifier:
      type: object
      description: Object holding identifying information for a flight.
      properties:
        carrier:
          type: string
          description: 2-digit IATA code of operating carrier.
          example: ZZ
        flight-number:
          type: string
          description: The flight number of the operating carrier. Should contain not more than 4 chars
            and must not include whitespaces. If less than 4 chars leading zeros will be added to normalize
            it to 4 chars.
          example: 997
        operational-suffix:
          type: string
          description: Used to distinguish two flights having the same flight number and departing from
            their respective origin stations on the same date.
          example: B
        origin-date:
          type: string
          format: date
          description: UTC scheduled date of departure of the first leg of the flight. Must be between
            2010-01-01 and 2210-01-01.
        identifier-string:
          type: string
          description: Automatically generated unique flight ID using format CARRIERFLIGHTNUMBER-DATE-ORIGIN-DESTINATION.
        iata-message-key:
          type: string
          description: Automatically generated key using format CARRIERFLIGHTNUMBERSOBT. SOBT in the origin
            timezone
        iata-message-key-utc:
          type: string
          description: Automatically generated key using format CARRIERFLIGHTNUMBERSOBT. SOBT coverted
            to UTC
        origin-iata-code:
          type: string
          description: 3-digit IATA code of origin airport.
          example: AAA
        destination-iata-code:
          type: string
          description: 3-digit IATA code of destination airport.
          example: ZZZ
      required:
      - carrier
      - destination-iata-code
      - flight-number
      - origin-date
      - origin-iata-code
    LoadIntoUldActivity:
      type: object
      description: BagActivity for ULD load/unload.
      properties:
        location-type:
          type: string
          description: Type of location.
          enum:
          - SEGMENT
          - OUTBOUND
          - INBOUND
        timestamp:
          type: string
          format: date-time
          description: Timestamp in UTC.
        location:
          type: string
          description: Location.
        uld-tag:
          type: string
          deprecated: true
          description: ULD tag . Deprecated - use containerTag instead.
        container-tag:
          type: string
          description: Container tag.
          example: A12345678
        container-type:
          type: string
          description: Container type like ULD/dolly/aircraft. The activity is dependent to this type.
          example: ULD
        container-activity:
          type: string
          description: Container activity.
          enum:
          - LOAD
          - OFFLOAD
          - REMOVE
          - MERGE
    Passenger:
