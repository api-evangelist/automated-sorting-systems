          type: array
          description: Flight segment(s) for which the event occurred.
          items:
            $ref: '#/components/schemas/ContainerEventSegment'
        activity:
          $ref: '#/components/schemas/ContainerActivity'
          description: Container activity for which the event occurred. Using different subtypes depending
            on event-type.
        adh-id:
          type: string
          description: Unique event id within ADH.
        correlation-id:
          type: string
          description: The global id which identifies this object across multiple applications.
      required:
      - activity
      - event-type
      - segments
      - tag
    FlightTime:
