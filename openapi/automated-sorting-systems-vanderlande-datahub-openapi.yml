    BagTag:
      type: object
      description: Object holding the state of a bag journey represented by bag tag.
      properties:
        meta:
          $ref: '#/components/schemas/AggregatedMeta'
          description: Metadata, generated by ADH.
          readOnly: true
        bag-tag-id:
          type: string
          description: Unique id of the bag tag in the data hub for an unlimited period of time.
          example: ABCD-1234
        merged-bag-tag-id:
          type: array
          description: Unique IDs of bag tags that have ended their life cycle and are merged into this
            one.
          items:
            type: string
          uniqueItems: true
        tag:
          type: string
          description: Tag number of the bag tag. Latest tag number in case of re-tagging.
          example: B12345678
        secondary-identifiers:
          type: array
          description: Additional identifiers for the bag tag used by BHS etc.
          items:
            $ref: '#/components/schemas/BagTagIdentifier'
          uniqueItems: true
        bag-type:
          type: string
          description: Bag type identifier.
          example: Hard Shell
        passenger:
          $ref: '#/components/schemas/Passenger'
          description: Passenger information for the bag.
        bag-segments:
          type: array
          deprecated: true
          description: Bag segments.
          items:
            $ref: '#/components/schemas/BagSegment'
        inbound-segment:
          $ref: '#/components/schemas/BagSegment'
          description: Inbound segment.
        outbound-segment:
          $ref: '#/components/schemas/BagSegment'
          description: Outbound segment.
        direction:
          type: string
          description: Direction that characterizes a bag tag
          enum:
          - INBOUND
          - OUTBOUND
          - TRANSFER
          example: INBOUND, OUTBOUND, TRANSFER
        runningAirportIataCode:
          type: string
        onward-segments:
          type: array
          description: Onward segments.
          items:
            $ref: '#/components/schemas/BagSegment'
        previous-segments:
          type: array
          description: Previous segments.
          items:
            $ref: '#/components/schemas/BagSegment'
        bag-risk:
          $ref: '#/components/schemas/BagTagRiskLevel'
        bag-journey:
          $ref: '#/components/schemas/BagJourney'
        global-state:
          type: string
          description: Global state of the bag tag, ACTIVE, COMPLETED or DELETED. It has into account
            inbound and outbound segment
          enum:
          - ACTIVE
          - COMPLETED
          - DELETED
          example: ACTIVE
