        container-type:
          type: string
          description: Container type identifier.
          example: ULD
        container-subtype:
          type: string
          description: Container subtype identifier
          example: AKE
        segments:
          type: array
          description: Container segments.
          items:
            $ref: '#/components/schemas/ContainerSegment'
          uniqueItems: true
    ContainerEvent:
      type: object
      description: Entity for Container Business Events. Use concrete subclass.
      discriminator:
        propertyName: event-type
      properties:
        meta:
          $ref: '#/components/schemas/BasicMeta'
          description: Event metadata, generated by ADH. May not be passed in.
          readOnly: true
        event-type:
          type: string
          description: Type of event, must match the type defined for the concrete subclass.
        container-id:
          type: string
          description: Unique id for the container. Can be used for an unlimited period of time.
        tag:
          type: string
          description: Tag number of the container for the current journey/usage .
          example: AKE12345678
        secondary-identifiers:
          type: array
          description: Additionally identifiers for the container journey/usage used by airports etc.
          items:
            $ref: '#/components/schemas/SecondaryIdentifier'
          uniqueItems: true
