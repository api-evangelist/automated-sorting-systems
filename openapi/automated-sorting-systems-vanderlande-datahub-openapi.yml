    post:
      tags:
      - Bpm Parser Store
      summary: Post a BPM.
      description: Parses a BPM (baggage processed message) and generates a bag event. New data is processed
        asynchronously and may need some time to be updated.
      operationId: parserBpm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BpmRawMessage'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                - type: object
                  additionalProperties:
                    type: object
                - type: object
                  additionalProperties:
                    type: string
