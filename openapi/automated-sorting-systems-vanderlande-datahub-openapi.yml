            deliver-at-reclaim-belt:
              $ref: '#/components/schemas/ContainerMovementActivity'
              description: Deliver at reclaim belt.
            open:
              $ref: '#/components/schemas/ContainerSecurityActivity'
              description: Open.
            empty:
              type: boolean
            remove:
              $ref: '#/components/schemas/ContainerContainerizationActivity'
              description: Remove from aircraft.
    ContainerTag:
      type: object
