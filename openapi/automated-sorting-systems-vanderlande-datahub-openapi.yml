          REGISTRATION: '#/components/schemas/ContainerRegistrationActivity'
          SECURITY: '#/components/schemas/ContainerSecurityActivity'
          MOVEMENT: '#/components/schemas/ContainerMovementActivity'
          STORAGE: '#/components/schemas/ContainerStorageActivity'
          CONTAINERIZATION: '#/components/schemas/ContainerContainerizationActivity'
      oneOf:
      - $ref: '#/components/schemas/ContainerRegistrationActivity'
      - $ref: '#/components/schemas/ContainerSecurityActivity'
      - $ref: '#/components/schemas/ContainerMovementActivity'
